schema_version: 1
last_verified: 2026-08-17
verified_by: sophiezhen
notes: |
  All rates are c/kWh INC 9% residential VAT.
  Standing charges are annual EUR INC VAT.
  PSO levy (€1.46/month ex VAT, applied to every electricity account) is
  added by the simulator; do NOT include it in standing_eur_per_year here.

  Each plan's `category` field indicates how the simulator should treat it:
    new_customer_offer  - listed for switching consideration (default)
    post_hike_standard  - the "do nothing past discount expiry" trap
    discontinued        - kept for traceability, not offered for new sign-ups

  Each plan's `availability` field says whether a household can ACTUALLY get
  onto it. This is a separate axis from `category`, and only `self_serve`
  plans are eligible to be the headline recommendation:
    self_serve              - can be signed up for online today (DEFAULT)
    agent_only              - published, but only via phone / retention desk
    unverified              - published, but we could not confirm a new
                              customer can get it; treated as unobtainable
    existing_customers_only - not open to switchers
  A published rate is not the same as an obtainable one: suppliers publish
  full tariff tables to satisfy CRU transparency rules while exposing only a
  subset in their sign-up flow. Ranking a rate the user cannot sign up for
  produces a recommendation they cannot act on.

  v0 catalogue covers the big six (EI, BG, Energia, SSE, Flogas, Yuno) plus
  Pinergy. Catalogue expansion to full smart-meter plan range is in progress.

